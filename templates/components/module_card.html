<a href="{{ href }}" class="module-row group">
  <span class="module-row__icon" aria-hidden="true">
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h10" />
    </svg>
  </span>
  <span class="min-w-0 flex-1">
    <span class="module-row__meta">{{ meta }}</span>
    <span class="module-row__title">{{ title }}</span>
    <span class="module-row__blurb">{{ blurb }}</span>
  </span>
  <span class="module-row__chevron" aria-hidden="true">→</span>
</a>
