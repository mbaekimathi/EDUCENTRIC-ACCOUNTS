<a href="{{ href }}"
   class="app-nav-link{% if is_active %} is-active{% endif %}"
   :title="sidebarCollapsed ? '{{ label|escapejs }}' : null"
   @click="sidebarOpen = false">
  <svg class="app-nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    {% if icon == "external" %}
    <path d="M10 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-linecap="round" stroke-linejoin="round"/>
    {% else %}
    <path d="M10 19l-7-7 7-7M17 6H7a2 2 0 0 0-2 2v10" stroke-linecap="round" stroke-linejoin="round"/>
    {% endif %}
  </svg>
  <span class="app-nav-link__label" :class="sidebarCollapsed && 'lg:hidden'">{{ label }}</span>
</a>
