<footer class="app-footer mt-auto border-t border-ink-950/8 bg-white/70 backdrop-blur-md">
  <div class="flex flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
    <div class="min-w-0">
      <p class="text-sm font-semibold text-ink-950">{{ brand.school_display }}</p>
      <p class="mt-0.5 text-xs text-ink-400">
        {% if brand.motto %}
          “{{ brand.motto }}”
        {% else %}
          Finance &amp; bursary workspace · Powered by Educentric
        {% endif %}
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs font-medium text-ink-400">
      <span>&copy; {% now "Y" %} {{ brand.school_name }}</span>
      <span class="hidden h-3 w-px bg-ink-950/10 sm:inline" aria-hidden="true"></span>
      <a href="{% url 'billing:dashboard' %}" class="transition hover:text-brand">Dashboard</a>
      <span class="text-ink-950/15" aria-hidden="true">·</span>
      <form method="post" action="{% url 'staff:logout' %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="transition hover:text-brand">Sign out</button>
      </form>
    </div>
  </div>
</footer>
